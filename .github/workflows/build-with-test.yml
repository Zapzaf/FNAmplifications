name: Build with Maven and Do Runtime Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v2.3.3
      
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 25
        cache: maven
    - name: Install Slimefun (26.3 fork)
      # Zapzaf/Slimefun4 fork with Minecraft 26.3 support (JitPack cannot build it, so it comes from the release)
      env:
        SLIMEFUN_RELEASE: https://github.com/Zapzaf/Slimefun4/releases/download/v4.9-fork.1
        SLIMEFUN_JAR: Slimefun-4.9-UNOFFICIAL-26.3.jar
      run: |
        curl -fsSLO "$SLIMEFUN_RELEASE/$SLIMEFUN_JAR"
        curl -fsSLO "$SLIMEFUN_RELEASE/SHA256SUMS.txt"
        grep "[ *]$SLIMEFUN_JAR\$" SHA256SUMS.txt | sha256sum -c -
        mvn -B install:install-file -Dfile="$SLIMEFUN_JAR" -DgroupId=com.github.Zapzaf \
          -DartifactId=Slimefun4 -Dversion=4.9-UNOFFICIAL-26.3 -Dpackaging=jar
    - name: Maven Build
      run: mvn clean package --file pom.xml
      
    - name: Upload the artifact
      uses: actions/upload-artifact@v3
      with:
        name: artifact-${{ github.event.number }}
        path: 'target/FNAmplifications*.jar'
  
  runtime-test:
    name: Plugin Runtime Test 
    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - mcVersion: '1.17.1'
            javaVersion: '17'
          - mcVersion: '1.18.2'
            javaVersion: '18'
          - mcVersion: '1.19.4'
            javaVersion: '19'
          - mcVersion: '1.20.1'
            javaVersion: '20'
          - mcVersion: '1.20.6'
            javaVersion: '21'
          - mcVersion: '1.21.1'
            javaVersion: '22'
    
    steps:        
      - uses: FN-FAL113/minecraft-plugin-runtime-test@v1.1.2
        with:
          server-version: ${{ matrix.mcVersion }}
          java-version: ${{ matrix.javaVersion }}
          artifact-name: artifact-${{ github.event.number }}
